<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Needlepoint Accessories - Haus of Toots</title>
    <meta name="description" content="Shop Haus of Toots needlepoint accessories, including Flash Sheet Needle Minders and stickers with plenty of personality.">
    <meta property="og:title" content="Needlepoint Accessories - Haus of Toots">
    <meta property="og:description" content="Shop Haus of Toots needlepoint accessories, including Flash Sheet Needle Minders and stickers with plenty of personality.">
    <meta property="og:image" content="https://hausoftoots.com/images/needleminders.webp">
    <meta property="og:url" content="https://hausoftoots.com/accessories">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Needlepoint Accessories - Haus of Toots">
    <meta name="twitter:description" content="Shop Haus of Toots needlepoint accessories, including Flash Sheet Needle Minders and stickers with plenty of personality.">
    <meta name="twitter:image" content="https://hausoftoots.com/images/needleminders.webp">
    <link rel="canonical" href="https://hausoftoots.com/accessories">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preload" href="images/needleminders.webp" as="image">
    <link rel="preconnect" href="https://haus-of-toots.myshopify.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fraunces:opsz,wght@9..144,650;9..144,700&family=Winky+Sans:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260704">
    <link rel="stylesheet" href="shop-styles.css?v=20260819d">
</head>
<body
    data-shop-tag="Accessories"
    data-shop-collection-title="Accessories"
    data-shop-empty-message="No accessories are available just yet. Check back soon for needle minders, stickers, and more tiny extras."
>
    <div id="shared-nav"></div>
    <div id="shared-stitch-sidebar"></div>
    <div id="shared-cursor-canvas"></div>
    <script src="shared-components.js?v=20260703" defer></script>

    <header class="series-header">
        <div class="container">
            <div class="series-header-layout">
                <div class="series-image-panel">
                    <img src="images/needleminders.webp" alt="Six Flash Sheet Needle Minders on pink Haus of Toots backing cards" class="series-header-image" width="1200" height="900">
                </div>
                <div class="series-copy">
                    <div class="stitched-border">
                        <div class="series-copy-inner">
                            <h1 class="hero-title">Haus of Toots <span class="highlight">Accessories</span></h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="shop-section">
        <div class="container">
            <div id="loadingState" class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading accessories...</p>
            </div>

            <div id="errorState" class="error-state" style="display: none;">
                <p>Oops! Unable to load accessories right now. Please try again later.</p>
            </div>

            <div id="productsGrid" class="products-grid" style="display: none;">
                <!-- Accessories tagged in Shopify will be inserted here by JavaScript -->
            </div>
        </div>
    </section>

    <div id="productModal" class="product-modal">
        <div class="product-modal-overlay"></div>
        <div class="product-modal-content">
            <button id="closeProductModal" class="close-product-modal" aria-label="Close product details">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div id="productModalBody" class="product-modal-body">
                <!-- Product details will be loaded here -->
            </div>
            <div id="productModalScrollbar" class="product-modal-scrollbar hidden" aria-hidden="true">
                <div class="product-modal-scrollbar-track"></div>
                <div id="productModalScrollbarThumb" class="product-modal-scrollbar-thumb"></div>
            </div>
        </div>
    </div>

    <div id="imageLightbox" class="image-lightbox">
        <div class="lightbox-overlay"></div>
        <button id="closeLightbox" class="lightbox-close" aria-label="Close lightbox">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button id="prevImage" class="lightbox-nav lightbox-prev" aria-label="Previous image">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <button id="nextImage" class="lightbox-nav lightbox-next" aria-label="Next image">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="" class="lightbox-image">
            <div id="lightboxCaption" class="lightbox-caption"></div>
        </div>
    </div>

    <div id="shared-footer"></div>
    <div id="shared-cart-drawer"></div>

    <script src="shopify-config.js?v=20260703" defer></script>
    <script src="shopify.js?v=20260817" defer></script>
    <script src="shop-app.js?v=20260819e" defer></script>
    <script src="script.js?v=20260703" defer></script>
</body>
</html>
