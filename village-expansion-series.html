<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDLPT Village Expansion Series - Haus of Toots</title>
    <meta name="description" content="The Village Expansion Series by Haus of Toots — storefront needlepoint canvases in holiday and everyday versions. The neighborhood keeps growing.">
    <meta property="og:title" content="NDLPT Village Expansion Series - Haus of Toots">
    <meta property="og:description" content="The Village Expansion Series by Haus of Toots — storefront needlepoint canvases in holiday and everyday versions. The neighborhood keeps growing.">
    <meta property="og:image" content="https://hausoftoots.com/images/village-expansion.webp">
    <meta property="og:url" content="https://hausoftoots.com/village">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NDLPT Village Expansion Series - Haus of Toots">
    <meta name="twitter:description" content="The Village Expansion Series by Haus of Toots — storefront needlepoint canvases in holiday and everyday versions. The neighborhood keeps growing.">
    <meta name="twitter:image" content="https://hausoftoots.com/images/village-expansion.webp">
    <link rel="canonical" href="https://hausoftoots.com/village">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://haus-of-toots.myshopify.com" crossorigin>
    <link rel="preconnect" href="https://cdn.shopify.com">
    <link rel="preload" href="images/fonts/chewy-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="images/fonts/winky-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css?v=20261029a">
    <link rel="stylesheet" href="shop-styles.css?v=20261029i">
    <link rel="stylesheet" href="village.css?v=20261104i">
</head>
<body
    data-title-collection="village"
    data-shop-collection="village"
    data-shop-collection-handle="village-expansion-series"
    data-shop-collection-title="Village Expansion Series"
    data-shop-collection-aliases="village, village expansion, village expansion series, holiday village, holiday village expansion, holiday village expansion series"
    data-shop-fresh-catalog="true"
    data-shop-group-storefronts="true"
    data-shop-empty-message="The Village Expansion Series is getting stitched into the shop now. Check back soon for the first drop."
>
    <div id="shared-nav"></div>
    <div id="shared-stitch-sidebar"></div>
    <div id="shared-cursor-canvas"></div>
    <script src="shared-components.js?v=20261029a" defer></script>

    <header class="series-header village-collection-header">
        <div class="container">
            <h1 class="village-collection-title">Village Expansion Series</h1>
            <div class="village-banner">
                <div class="village-banner-art">
                <div class="village-responsive-sky" aria-hidden="true">
                    <span class="village-responsive-sun"></span>
                    <svg class="village-responsive-cloud" viewBox="0 0 80 30" focusable="false"><path d="M2 25c-2-10 9-16 17-10C23-4 48-1 50 15c17-7 27 0 28 10Z"/></svg>
                    <svg class="village-responsive-cloud village-responsive-cloud-far" viewBox="0 0 80 30" focusable="false"><path d="M2 25c-2-10 9-16 17-10C23-4 48-1 50 15c17-7 27 0 28 10Z"/></svg>
                </div>
                <picture>
                    <source media="(max-width: 600px)" srcset="images/village-neighborhood-mobile.svg?v=20261105road2">
                    <source media="(max-width: 1100px)" srcset="images/village-neighborhood.svg?v=20261105road2">
                    <img class="village-streetscape" src="images/village-streetscape.svg?v=20261105road2" alt="" width="1440" height="300" fetchpriority="high">
                </picture>
                <svg class="village-header-sign" viewBox="0 0 320 174" aria-hidden="true" focusable="false">
                            <!-- A miniature town sign, planted in front of the storefront photo. -->
                            <g fill="var(--coral-light)" stroke="var(--purple-text)" stroke-width="3">
                                <path d="M65 106h13v68H65zM242 106h13v68h-13z"/>
                            </g>
                            <path d="M12 47h38C66 22 108 10 160 10s94 12 110 37h38v91H12Z" fill="var(--cream)" stroke="var(--coral-primary)" stroke-width="4" stroke-linejoin="round"/>
                            <path d="M21 56h34C72 31 111 19 160 19s88 12 105 37h34v73H21Z" fill="none" stroke="var(--purple-text)" stroke-width="1.5"/>
                            <defs>
                                <path id="village-header-welcome-arch" d="M78 65Q160 25 242 65"/>
                            </defs>
                            <text class="village-sign-welcome" text-anchor="middle"><textPath href="#village-header-welcome-arch" startOffset="50%">WELCOME TO</textPath></text>
                            <text class="village-sign-name" x="160" y="99" text-anchor="middle">Toots Village</text>
                            <!-- Sweeping brush flourishes sit below the lettering, framing the seedling. -->
                            <g fill="var(--coral-primary)" fill-opacity=".8">
                                <path d="M75 116c13 7 29 8 44 3l8-4c-5 6-12 9-22 9-12 0-23-3-30-8Z"/>
                                <path d="M245 116c-13 7-29 8-44 3l-8-4c5 6 12 9 22 9 12 0 23-3 30-8Z"/>
                            </g>
                            <!-- A tiny seedling for a village that keeps growing. -->
                            <g stroke="var(--coral-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M153 112q3 4 7 6 4-2 7-6m-7 6v5" fill="none"/>
                                <path d="M153 112q-6 1-6-6 7 0 6 6Zm14 0q6 1 6-6-7 0-6 6Z" fill="var(--coral-light)"/>
                            </g>
                            <g fill="var(--coral-primary)">
                                <circle cx="29" cy="66" r="2.5"/><circle cx="291" cy="66" r="2.5"/>
                                <circle cx="29" cy="119" r="2.5"/><circle cx="291" cy="119" r="2.5"/>
                            </g>
                        </svg>
                </div>
            </div>
        </div>
    </header>

    <section class="shop-section">
        <div class="container">
            <div id="loadingState" class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading products...</p>
            </div>

            <div id="errorState" class="error-state" style="display: none;">
                <p>Oops! Unable to load this collection right now. Please try again later.</p>
            </div>

            <div id="productsGrid" class="products-grid" data-product-layout="pairs" style="display: none;">
                <!-- Products will be inserted here by JavaScript -->
            </div>
        </div>
    </section>

    <div id="productModal" class="product-modal">
        <div class="product-modal-overlay"></div>
        <div class="product-modal-content">
            <button id="closeProductModal" class="close-product-modal" aria-label="Close product details">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div id="productModalBody" class="product-modal-body">
                <!-- Product details will be loaded here -->
            </div>
            <div id="productModalScrollbar" class="product-modal-scrollbar hidden" aria-hidden="true">
                <div class="product-modal-scrollbar-track"></div>
                <div id="productModalScrollbarThumb" class="product-modal-scrollbar-thumb"></div>
            </div>
        </div>
    </div>

    <div id="imageLightbox" class="image-lightbox">
        <div class="lightbox-overlay"></div>
        <button id="closeLightbox" class="lightbox-close" aria-label="Close lightbox">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button id="prevImage" class="lightbox-nav lightbox-prev" aria-label="Previous image">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <button id="nextImage" class="lightbox-nav lightbox-next" aria-label="Next image">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="" class="lightbox-image">
            <div id="lightboxCaption" class="lightbox-caption"></div>
        </div>
    </div>

    <div id="shared-footer"></div>
    <div id="shared-cart-drawer"></div>

    <script src="shopify-config.js?v=20260703" defer></script>
    <script src="shopify.js?v=20261104b" defer></script>
    <script src="shop-app.js?v=20261104b" defer></script>
    <script src="script.js?v=20261007c" defer></script>
</body>
</html>
