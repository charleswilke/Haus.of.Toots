<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Stage Collection - Haus of Toots</title>
    <meta name="description" content="The Main Stage Collection by Haus of Toots: twelve bold needlepoint designs celebrating women and unapologetic femininity. Shop the Serving and She Is series.">
    <meta property="og:title" content="Main Stage Collection - Haus of Toots">
    <meta property="og:description" content="The Main Stage Collection by Haus of Toots: twelve bold needlepoint designs celebrating women and unapologetic femininity. Shop the Serving and She Is series.">
    <meta property="og:image" content="https://hausoftoots.com/images/mainstage-collection.webp">
    <meta property="og:url" content="https://hausoftoots.com/main-stage-collection">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Main Stage Collection - Haus of Toots">
    <meta name="twitter:description" content="The Main Stage Collection by Haus of Toots: twelve bold needlepoint designs celebrating women and unapologetic femininity. Shop the Serving and She Is series.">
    <meta name="twitter:image" content="https://hausoftoots.com/images/mainstage-collection.webp">
    <link rel="canonical" href="https://hausoftoots.com/main-stage-collection">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://haus-of-toots.myshopify.com" crossorigin>
    <link rel="preconnect" href="https://cdn.shopify.com">
    <link rel="preload" href="images/fonts/chewy-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="images/fonts/winky-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css?v=20260918b">
    <link rel="stylesheet" href="shop-styles.css?v=20260922e">
    <link rel="stylesheet" href="mainstage.css?v=20260922j">
    <script src="mainstage.js?v=20260922d" defer></script>
</head>
<body
    data-shop-collection="main-stage-collection"
    data-shop-collection-handle="main-stage-collection"
    data-shop-collection-title="Main Stage Collection"
    data-shop-collection-aliases="main stage, mainstage"
    data-shop-priority-keywords="charisma, uniqueness, nerve, talent"
    data-shop-secondary-title-keyword="serving"
    data-shop-fallback-title-prefixes="serving, she is"
    data-shop-fresh-catalog="true"
    data-shop-empty-message="The Main Stage Collection is getting ready for its debut. Please check back soon."
>
    <div id="shared-nav"></div>
    <div id="shared-stitch-sidebar"></div>
    <div id="shared-cursor-canvas"></div>
    <script src="shared-components.js?v=20260918b" defer></script>

    <header class="series-header mainstage-collection-header">
        <div class="container">
            <!-- Same striped show-poster frame and animated wordmark as the homepage feature. -->
            <div class="mainstage-feature mainstage-collection-banner">
                <div class="mainstage-collection-copy">
                    <h1 class="mainstage-collection-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="234" viewBox="0 0 400 234" class="mainstage-wordmark" data-layout="stacked" data-wide-query="(min-width: 701px)" role="img" aria-labelledby="mainstageWordmarkTitle" aria-describedby="mainstageWordmarkDescription">
                          <title id="mainstageWordmarkTitle">Main Stage — The Collection</title>
                          <desc id="mainstageWordmarkDescription">A glow rises through the pink depth of every letter together. Small ivory sparks twinkle in different places as the violet-to-berry gradient faces light up, then fade as the letters settle back to their resting color.</desc>
                          <defs>
                            <linearGradient id="mainstage-face-gradient" gradientUnits="userSpaceOnUse" x1="0%" y1="0%" x2="100%" y2="0%">
                              <stop offset="0%" stop-color="#242457"/>
                              <stop offset="55%" stop-color="#3e214d"/>
                              <stop offset="100%" stop-color="#7b2c67"/>
                            </linearGradient>
                            <g id="mainstage-spark">
                              <path d="M0 -10 2 -2 10 0 2 2 0 10 -2 2 -10 0 -2 -2Z"/>
                              <circle cx="12" cy="-9" r="1.3" fill="#ffe091"/>
                              <circle cx="-11" cy="8" r="1" fill="#ffe091"/>
                            </g>
                            <!-- Original letter outlines. No font dependency; counters use even-odd fill. -->
                            <g id="mainstage-lettering" fill-rule="evenodd" transform="translate(40 12) skewX(-9)">
                              <g transform="scale(1.17 .94)">
                                <!-- MAIN -->
                                <path d="M0 80V0H19L39 28 59 0H78V80H55V35L39 56 23 35V80Z"/>
                                <path transform="translate(85)" d="M0 80 20 0H55L75 80H50L46 62H27L23 80ZM34 22 30 43H43L39 22Z"/>
                                <path transform="translate(168)" d="M0 0H28V80H0Z"/>
                                <path transform="translate(204)" d="M0 80V0H23L52 40V0H75V80H52L23 39V80Z"/>
                              </g>
                              <g class="mainstage-stage-letters" transform="translate(0 87) scale(.88 .94)">
                                <!-- STAGE -->
                                <path d="M65 0H14L0 14V40L12 51H42V60H0V80H52L67 65V42L54 29H25V20H65Z"/>
                                <path transform="translate(74)" d="M0 0H70V22H47V80H23V22H0Z"/>
                                <path transform="translate(151)" d="M0 80 20 0H55L75 80H50L46 62H27L23 80ZM34 22 30 43H43L39 22Z"/>
                                <path transform="translate(233)" d="M74 0H15L0 15V65L15 80H74V35H37V53H51V59H25V21H74Z"/>
                                <path transform="translate(314)" d="M0 0H65V21H25V29H58V49H25V59H65V80H0Z"/>
                              </g>
                            </g>
                            <mask id="mainstage-face-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="740" height="234">
                              <use href="#mainstage-lettering" fill="white"/>
                            </mask>
                          </defs>
                          <!-- Each depth contains the entire wordmark, so MAIN and STAGE pulse together.
                               The delay advances from the farthest layer (10px) to the nearest (2px). -->
                          <g>
                            <use class="depth-layer" href="#mainstage-lettering" transform="translate(10 10)" fill="#c82174" style="--layer-color: #c82174; --layer-delay: 0s"/>
                            <use class="depth-layer" href="#mainstage-lettering" transform="translate(8 8)" fill="#d8257c" style="--layer-color: #d8257c; --layer-delay: .22s"/>
                            <use class="depth-layer" href="#mainstage-lettering" transform="translate(6 6)" fill="#e52a83" style="--layer-color: #e52a83; --layer-delay: .44s"/>
                            <use class="depth-layer" href="#mainstage-lettering" transform="translate(4 4)" fill="#ed388c" style="--layer-color: #ed388c; --layer-delay: .66s"/>
                            <use class="depth-layer" href="#mainstage-lettering" transform="translate(2 2)" fill="#f34897" style="--layer-color: #f34897; --layer-delay: .88s"/>
                          </g>
                          <!-- One shared color surface across both words, clipped to all letter faces. -->
                          <g class="letter-face" mask="url(#mainstage-face-mask)">
                            <rect width="100%" height="100%" fill="url(#mainstage-face-gradient)"/>
                          </g>
                          <!-- Sparks share the face's 5.8s cycle and peak around its 40% highlight. -->
                          <g aria-hidden="true" pointer-events="none">
                            <g transform="translate(56 21)"><use class="title-spark" href="#mainstage-spark"/></g>
                            <g transform="translate(324 69) scale(.8)"><use class="title-spark" href="#mainstage-spark" style="--spark-delay: .12s"/></g>
                            <g transform="translate(64 146) scale(.75)"><use class="title-spark" href="#mainstage-spark" style="--spark-delay: .2s"/></g>
                            <g transform="translate(228 107)"><use class="title-spark" href="#mainstage-spark" style="--spark-delay: .06s"/></g>
                            <g transform="translate(306 164) scale(.8)"><use class="title-spark" href="#mainstage-spark" style="--spark-delay: .16s"/></g>
                          </g>
                          <!-- The collection label shares the title's purple gradient on a pink ribbon. -->
                          <g aria-hidden="true">
                            <path class="mainstage-underline" d="M13 194H352L347 226H8Z" fill="#ffb7d7"/>
                            <text class="mainstage-collection-label" x="180" y="210" text-anchor="middle" dominant-baseline="central">THE COLLECTION</text>
                          </g>
                        </svg>
                    </h1>
                </div>
            </div>
        </div>
    </header>

    <section class="shop-section">
        <div class="container">
            <div id="loadingState" class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading products...</p>
            </div>

            <div id="errorState" class="error-state" style="display: none;">
                <p>Oops! Unable to load this collection right now. Please try again later.</p>
            </div>

            <div id="productsGrid" class="products-grid" style="display: none;">
                <!-- Products will be inserted here by JavaScript -->
            </div>
        </div>
    </section>

    <div id="productModal" class="product-modal">
        <div class="product-modal-overlay"></div>
        <div class="product-modal-content">
            <button id="closeProductModal" class="close-product-modal" aria-label="Close product details">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div id="productModalBody" class="product-modal-body">
                <!-- Product details will be loaded here -->
            </div>
            <div id="productModalScrollbar" class="product-modal-scrollbar hidden" aria-hidden="true">
                <div class="product-modal-scrollbar-track"></div>
                <div id="productModalScrollbarThumb" class="product-modal-scrollbar-thumb"></div>
            </div>
        </div>
    </div>

    <div id="imageLightbox" class="image-lightbox">
        <div class="lightbox-overlay"></div>
        <button id="closeLightbox" class="lightbox-close" aria-label="Close lightbox">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button id="prevImage" class="lightbox-nav lightbox-prev" aria-label="Previous image">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <button id="nextImage" class="lightbox-nav lightbox-next" aria-label="Next image">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="" class="lightbox-image">
            <div id="lightboxCaption" class="lightbox-caption"></div>
        </div>
    </div>

    <div id="shared-footer"></div>
    <div id="shared-cart-drawer"></div>

    <script src="shopify-config.js?v=20260703" defer></script>
    <script src="shopify.js?v=20260922c" defer></script>
    <script src="shop-app.js?v=20260922d" defer></script>
    <script src="script.js?v=20260830c" defer></script>
</body>
</html>
