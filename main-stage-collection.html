<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Stage Collection - Haus of Toots</title>
    <meta name="description" content="The Main Stage Collection by Haus of Toots: twelve bold needlepoint designs celebrating women and unapologetic femininity. Shop the Serving and She Is series.">
    <meta property="og:title" content="Main Stage Collection - Haus of Toots">
    <meta property="og:description" content="The Main Stage Collection by Haus of Toots: twelve bold needlepoint designs celebrating women and unapologetic femininity. Shop the Serving and She Is series.">
    <meta property="og:image" content="https://hausoftoots.com/images/mainstage-collection.webp">
    <meta property="og:url" content="https://hausoftoots.com/main-stage-collection">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Main Stage Collection - Haus of Toots">
    <meta name="twitter:description" content="The Main Stage Collection by Haus of Toots: twelve bold needlepoint designs celebrating women and unapologetic femininity. Shop the Serving and She Is series.">
    <meta name="twitter:image" content="https://hausoftoots.com/images/mainstage-collection.webp">
    <link rel="canonical" href="https://hausoftoots.com/main-stage-collection">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://haus-of-toots.myshopify.com" crossorigin>
    <link rel="preconnect" href="https://cdn.shopify.com">
    <link rel="preload" href="images/fonts/chewy-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="images/fonts/winky-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css?v=20260918b">
    <link rel="stylesheet" href="shop-styles.css?v=20260910c">
    <link rel="stylesheet" href="mainstage.css?v=20260921a">
</head>
<body
    data-shop-collection="main-stage-collection"
    data-shop-collection-handle="main-stage-collection"
    data-shop-collection-title="Main Stage Collection"
    data-shop-collection-aliases="main stage, mainstage"
    data-shop-priority-keywords="charisma, uniqueness, nerve, talent"
    data-shop-secondary-title-keyword="serving"
    data-shop-fallback-title-prefixes="serving, she is"
    data-shop-fresh-catalog="true"
    data-shop-empty-message="The Main Stage Collection is getting ready for its debut. Please check back soon."
>
    <div id="shared-nav"></div>
    <div id="shared-stitch-sidebar"></div>
    <div id="shared-cursor-canvas"></div>
    <script src="shared-components.js?v=20260918b" defer></script>

    <header class="series-header">
        <div class="container">
            <div class="series-header-layout">
                <div class="series-copy">
                    <div class="stitched-border">
                        <div class="series-copy-inner">
                            <h1 class="hero-title"><span class="highlight">Main Stage</span> Collection</h1>
                            <p class="hero-description">Big hair. Bold color. Taking up space. Twelve designs celebrating women and unapologetic femininity.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="shop-section">
        <div class="container">
            <div id="loadingState" class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading products...</p>
            </div>

            <div id="errorState" class="error-state" style="display: none;">
                <p>Oops! Unable to load this collection right now. Please try again later.</p>
            </div>

            <div id="productsGrid" class="products-grid" style="display: none;">
                <!-- Products will be inserted here by JavaScript -->
            </div>
        </div>
    </section>

    <div id="productModal" class="product-modal">
        <div class="product-modal-overlay"></div>
        <div class="product-modal-content">
            <button id="closeProductModal" class="close-product-modal" aria-label="Close product details">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div id="productModalBody" class="product-modal-body">
                <!-- Product details will be loaded here -->
            </div>
            <div id="productModalScrollbar" class="product-modal-scrollbar hidden" aria-hidden="true">
                <div class="product-modal-scrollbar-track"></div>
                <div id="productModalScrollbarThumb" class="product-modal-scrollbar-thumb"></div>
            </div>
        </div>
    </div>

    <div id="imageLightbox" class="image-lightbox">
        <div class="lightbox-overlay"></div>
        <button id="closeLightbox" class="lightbox-close" aria-label="Close lightbox">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button id="prevImage" class="lightbox-nav lightbox-prev" aria-label="Previous image">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <button id="nextImage" class="lightbox-nav lightbox-next" aria-label="Next image">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="" class="lightbox-image">
            <div id="lightboxCaption" class="lightbox-caption"></div>
        </div>
    </div>

    <div id="shared-footer"></div>
    <div id="shared-cart-drawer"></div>

    <script src="shopify-config.js?v=20260703" defer></script>
    <script src="shopify.js?v=20260922c" defer></script>
    <script src="shop-app.js?v=20260922c" defer></script>
    <script src="script.js?v=20260830c" defer></script>
</body>
</html>
