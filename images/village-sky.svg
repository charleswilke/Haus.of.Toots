<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 300" preserveAspectRatio="none" fill="none">
  
  <defs>
    <linearGradient id="village-sky" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#b3cddd" />
      <stop offset=".55" stop-color="#ccdae5" />
      <stop offset="1" stop-color="#dce5e6" />
    </linearGradient>
    <radialGradient id="village-corner-warmth" gradientUnits="userSpaceOnUse" cx="-30" cy="-20" r="1160" gradientTransform="scale(1 .48)">
      <stop offset="0" stop-color="#eac0a7" />
      <stop offset=".32" stop-color="#edc9b4" stop-opacity=".95" />
      <stop offset=".65" stop-color="#e8c4c8" stop-opacity=".7" />
      <stop offset="1" stop-color="#dfcbdc" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="village-peach-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#edc4aa" stop-opacity=".85" />
      <stop offset=".55" stop-color="#efc0be" stop-opacity=".65" />
      <stop offset="1" stop-color="#e8cbdc" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="village-blue-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c6bfdb" stop-opacity="0" />
      <stop offset=".45" stop-color="#c3c5e1" stop-opacity=".65" />
      <stop offset="1" stop-color="#9fc4dc" stop-opacity=".7" />
    </linearGradient>
    <filter id="village-sky-soften" x="-15%" y="-100%" width="130%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <radialGradient id="village-sun-halo">
      <stop offset="0" stop-color="#fff0cc" stop-opacity=".35" />
      <stop offset="1" stop-color="#fff0cc" stop-opacity="0" />
    </radialGradient>
    <pattern id="toy-stripes" width="18" height="110" patternUnits="userSpaceOnUse"><path fill="#cf7e88" d="M0 0h3v110H0z" /><path fill="#6ea6a0" d="M3 0h3v110H3z" /><path fill="#e3c777" d="M6 0h3v110H6z" /><path fill="#8cb4b4" d="M9 0h3v110H9z" /><path fill="#d8a3b4" d="M12 0h3v110h-3z" /><path fill="#849db9" d="M15 0h3v110h-3z" /></pattern>
    <pattern id="toy-roof" width="12" height="7" patternUnits="userSpaceOnUse"><path fill="#b58e77" d="M0 0h12v7H0z" /><path fill="#96765f" d="M0 5h12v2H0z" /></pattern>
    <pattern id="awning-stripes" width="26" height="35" patternUnits="userSpaceOnUse" patternTransform="skewX(-12)"><path fill="#faf8f5" d="M0 0h13v35H0z" /><path fill="#83a7a0" d="M13 0h13v35H13z" /></pattern>
    <g id="window"><path fill="#faf8f5" d="M0 0h26v32H0z" /><path fill="#9cb7b4" d="M3 3h20v26H3z" /><path stroke="#faf8f5" stroke-width="2" d="M13 3v26M3 15h20" /></g>
    <g id="tree"><path stroke="#88749c" stroke-width="4" d="M0 0v52" /><ellipse cy="-8" rx="18" ry="29" fill="#8baaa2" /><ellipse cx="-6" cy="-11" rx="9" ry="20" fill="#a6bdb0" /></g>
  </defs>
  <style>
    .village-cloud { transform-box: fill-box; transform-origin: center; }
    @keyframes cloud-drift { from { transform: translateX(-26px); } to { transform: translateX(44px); } }
    @media (prefers-reduced-motion: no-preference) {
      .village-cloud { animation: cloud-drift 48s ease-in-out -18s infinite alternate; }
      .village-cloud-far { animation-duration: 67s; animation-delay: -40s; }
    }
  </style>
  <path fill="url(#village-sky)" d="M0 0h1440v300H0z" />
  <path fill="url(#village-corner-warmth)" d="M0 0h1440v300H0Z" />
  
  <g fill="none" stroke-linecap="round" filter="url(#village-sky-soften)">
