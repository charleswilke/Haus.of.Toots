<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 144" width="32" height="144" preserveAspectRatio="none">
  <title>Dimensional silver sign chain</title>
  <defs>
    <linearGradient id="chain-steel" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#363b42"/>
      <stop offset=".16" stop-color="#969c9d"/>
      <stop offset=".31" stop-color="#f9f1de"/>
      <stop offset=".48" stop-color="#c2c5bd"/>
      <stop offset=".70" stop-color="#7b8182"/>
      <stop offset=".88" stop-color="#454b53"/>
      <stop offset="1" stop-color="#a0a4a1"/>
    </linearGradient>
    <linearGradient id="chain-edge">
      <stop stop-color="#333a43"/>
      <stop offset=".24" stop-color="#8a9190"/>
      <stop offset=".44" stop-color="#fff4df"/>
      <stop offset=".60" stop-color="#bfc3ba"/>
      <stop offset=".82" stop-color="#656e73"/>
      <stop offset="1" stop-color="#353c45"/>
    </linearGradient>
    <!-- Hollow face-on links retain the view through the hanging chain. -->
    <g id="chain-face">
      <path d="M16 0C8.8 0 3 6 3 13.5v11C3 32 8.8 38 16 38s13-6 13-13.5v-11C29 6 23.2 0 16 0Zm0 6c4 0 7 3.4 7 7.5v11c0 4.1-3 7.5-7 7.5s-7-3.4-7-7.5v-11C9 9.4 12 6 16 6Z" fill="url(#chain-steel)" fill-rule="evenodd" stroke="#343b43" stroke-width="1.2"/>
      <path d="M16 2.2C10 2.2 5.2 7.3 5.2 13.5v10.8" fill="none" stroke="#fff9e9" stroke-opacity=".8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M16 34.6c5.6 0 10.3-4.5 10.3-10.1V14" fill="none" stroke="#242c36" stroke-opacity=".6" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M20.7 10.4c1 1 1.4 2.2 1.4 4.1v9.8" fill="none" stroke="#f4eddd" stroke-opacity=".65" stroke-width="1" stroke-linecap="round"/>
    </g>
    <!-- Narrow links turn through the adjoining face-on openings. -->
    <g id="chain-turned">
      <path d="M16 0c-4.2 0-6.4 5.8-6.4 12.7v10.6C9.6 30.4 12 36 16 36s6.4-5.6 6.4-12.7V12.7C22.4 5.8 20.2 0 16 0Zm0 6.8c1.1 1.7 1.5 3.9 1.5 6.3v9.8c0 2.6-.4 4.8-1.5 6.3-1.1-1.5-1.5-3.7-1.5-6.3v-9.8c0-2.4.4-4.6 1.5-6.3Z" fill="url(#chain-edge)" fill-rule="evenodd" stroke="#39414a" stroke-width="1"/>
      <path d="M14.1 4.5c-1.3 2.1-2 5-2 8.2v10.6c0 3 .5 5.4 1.5 7.3" fill="none" stroke="#fff5df" stroke-opacity=".85" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M19.7 12.8v10.5" fill="none" stroke="#202b36" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- The first and last links continue beyond the crop into their supports. -->
  <use href="#chain-face" y="-19"/>
  <use href="#chain-face" y="17"/>
  <use href="#chain-face" y="53"/>
  <use href="#chain-face" y="89"/>
  <use href="#chain-face" y="125"/>
  <use href="#chain-turned" y="2"/>
  <use href="#chain-turned" y="38"/>
  <use href="#chain-turned" y="74"/>
  <use href="#chain-turned" y="110"/>
</svg>
