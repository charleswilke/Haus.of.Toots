<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Haus of Toots</title>
  <desc id="description">Cute, weird, wildly specific needlepoint canvases.</desc>

  <defs>
    <pattern id="needlepoint-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 2L7 7M7 2L2 7M11 11L16 16M16 11L11 16" fill="none" stroke="#D8D0C8" stroke-width="0.8" stroke-linecap="round" opacity="0.32"/>
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8C605A" flood-opacity="0.10"/>
    </filter>

    <g id="sparkle" fill="currentColor">
      <path d="M14 0C14.8 9.2 18.8 13.2 28 14C18.8 14.8 14.8 18.8 14 28C13.2 18.8 9.2 14.8 0 14C9.2 13.2 13.2 9.2 14 0Z"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#FAF8F5"/>
  <rect width="1200" height="630" fill="url(#needlepoint-grid)"/>
  <rect x="32" y="32" width="1136" height="566" rx="28" fill="none" stroke="#FF6B7A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 11" opacity="0.34"/>

  <g opacity="0.82">
    <g color="#FF6B7A">
      <use xlink:href="#sparkle" transform="translate(78 83) scale(0.72)"/>
      <use xlink:href="#sparkle" transform="translate(109 117) scale(0.46)"/>
    </g>
    <g color="#CB6CE6">
      <use xlink:href="#sparkle" transform="translate(1050 82) scale(0.90)"/>
      <use xlink:href="#sparkle" transform="translate(1094 126) scale(0.46)"/>
    </g>
  </g>

  <image x="177" y="74" width="846" height="402" xlink:href="HoT-wordmark.png" preserveAspectRatio="xMidYMid meet" filter="url(#soft-shadow)"/>

  <text x="600" y="516" text-anchor="middle" fill="#CB6CE6" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="31" font-weight="700" letter-spacing="2.2">CUTE.  WEIRD.  WILDLY SPECIFIC.</text>
  <text x="600" y="558" text-anchor="middle" fill="#5A4036" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="20" font-weight="600" letter-spacing="4.2">UNIQUE NEEDLEPOINT CANVASES</text>

  <g opacity="0.82">
    <g color="#CB6CE6">
      <use xlink:href="#sparkle" transform="translate(83 518) scale(0.68)"/>
    </g>
    <g color="#FF6B7A">
      <use xlink:href="#sparkle" transform="translate(1072 504) scale(0.46)"/>
      <use xlink:href="#sparkle" transform="translate(1098 529) scale(0.72)"/>
    </g>
  </g>
</svg>
